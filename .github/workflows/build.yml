name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK (release)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p saida
          cp app/build/outputs/apk/release/app-release.apk "saida/PontosVoith-${VER}.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PontosVoith-APK
          path: saida/*.apk

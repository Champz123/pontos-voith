name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # Versão fixa do Ubuntu (evita surpresas com a migração do ubuntu-latest)
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # O Android SDK já vem instalado no runner do GitHub (ANDROID_HOME).
      # A etapa "setup-android" foi removida: era a causa do erro na V1.
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK (release)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p saida
          cp app/build/outputs/apk/release/app-release.apk "saida/PontosVoith-${VER}.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PontosVoith-APK
          path: saida/*.apk
